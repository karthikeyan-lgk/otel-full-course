apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      # Exemplars from OTLP carry the trace id in a trace_id label: open it in the Jaeger UI.
      # (A link, not datasourceUid: Grafana's Jaeger data source can't read Jaeger 2's API yet.)
      exemplarTraceIdDestinations:
        - name: trace_id
          url: http://localhost:16686/trace/$${__value.raw}
          urlDisplayLabel: Open in Jaeger

  - name: Jaeger
    uid: jaeger
    type: jaeger
    url: http://jaeger:16686

  - name: Loki
    uid: loki
    type: loki
    url: http://loki:3100
    jsonData:
      # OTLP logs keep trace_id as structured metadata, so match it as a label, not a regex on the line.
      derivedFields:
        - name: TraceID
          matcherType: label
          matcherRegex: trace_id
          url: http://localhost:16686/trace/$${__value.raw}
          urlDisplayLabel: Open in Jaeger
