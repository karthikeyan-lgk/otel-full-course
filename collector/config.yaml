# Slice Shop Collector. Chapter 2 started with receive -> protect -> batch -> export;
# chapter 7 adds the filter, the attribute scrub, span_metrics and the Collector's own metrics;
# chapter 8 adds tail sampling.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  # First in every pipeline: refuse data before the Collector runs out of memory.
  memory_limiter:
    check_interval: 1s
    limit_percentage: 80
    spike_limit_percentage: 20

  # Chapter 7: FastAPI's zero-code instrumentation adds an "http receive" and two "http send"
  # spans to every request. They only say the ASGI server moved bytes, so drop them here.
  filter/asgi_noise:
    error_mode: ignore
    traces:
      span:
        - 'attributes["asgi.event.type"] != nil'

  # Chapter 7: the caller's IP is personal data on a real frontend. Remove it before it's stored.
  attributes/scrub:
    actions:
      - key: client.address
        action: delete
      - key: client.port
        action: delete

  # Chapter 8: wait until a trace is complete, then decide. Keep every error and every slow
  # trace, and one in ten of the boring rest. If any policy says "keep", the trace is kept.
  tail_sampling:
    decision_wait: 10s
    num_traces: 50000
    policies:
      - name: errors
        type: status_code
        status_code:
          status_codes: [ERROR]
      - name: slow
        type: latency
        latency:
          threshold_ms: 1000
      - name: one-in-ten
        type: probabilistic
        probabilistic:
          sampling_percentage: 10

  # Last before the exporters: fewer, bigger requests to the backends.
  batch: {}

connectors:
  # Chapter 7: turns every span into request, error and duration metrics, even for
  # Redis and Postgres calls, which send no metrics of their own.
  span_metrics: {}
  # Chapter 8: hands every span on to the sampling pipeline, so span_metrics above still counts
  # 100% of the requests and only Jaeger gets the sampled traces.
  forward/sampling: {}

exporters:
  otlp_grpc/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true
  otlp_http/prometheus:
    endpoint: http://prometheus:9090/api/v1/otlp
  otlp_http/loki:
    endpoint: http://loki:3100/otlp
  debug:
    verbosity: basic

service:
  # Chapter 7: the Collector's own metrics (spans in, dropped, out) go to Prometheus too.
  telemetry:
    metrics:
      readers:
        - periodic:
            exporter:
              otlp:
                protocol: http/protobuf
                endpoint: http://prometheus:9090/api/v1/otlp/v1/metrics
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, filter/asgi_noise, attributes/scrub]
      exporters: [span_metrics, forward/sampling]
    traces/sampled:
      receivers: [forward/sampling]
      processors: [tail_sampling, batch]
      exporters: [otlp_grpc/jaeger, debug]
    metrics:
      receivers: [otlp, span_metrics]
      processors: [memory_limiter, batch]
      exporters: [otlp_http/prometheus]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp_http/loki]
