# Chapter 10: declarative configuration. With OTEL_CONFIG_FILE set, this file is the only source
# of SDK settings for kitchen: the OTEL_* environment variables are ignored.
file_format: "1.0"
resource:
  attributes:
    - name: service.name
      value: kitchen
    - name: deployment.environment.name
      value: lab
    # OTEL_RESOURCE_ATTRIBUTES is ignored when this file is used, so the version has to be here too.
    - name: service.version
      value: 1.0.0
propagator:
  composite:
    - tracecontext:
    - baggage:
tracer_provider:
  processors:
    - batch:
        exporter:
          otlp_http:
            endpoint: http://collector:4318/v1/traces
meter_provider:
  readers:
    - periodic:
        interval: 10000
        exporter:
          otlp_http:
            endpoint: http://collector:4318/v1/metrics
logger_provider:
  processors:
    - batch:
        exporter:
          otlp_http:
            endpoint: http://collector:4318/v1/logs
